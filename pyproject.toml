[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "per-plex"
dynamic = ["version"]
description = "Chat with Perplexity from your terminal (Agent API)."
readme = "README.md"
authors = [
    { name = "Ilia Petrov-Komotskii", email = "ilia@inkedkettle.games" }
]
license = "MIT"
requires-python = ">=3.11"
keywords = ["perplexity", "chat", "cli", "tui", "terminal", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "perplexityai>=0.47",
    "rich>=13",
    "textual>=8,<9",  # the TUI overrides private Textual hooks (see tui/screens.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/ManeFunction/per-plex"
Repository = "https://github.com/ManeFunction/per-plex"
Issues = "https://github.com/ManeFunction/per-plex/issues"
Changelog = "https://github.com/ManeFunction/per-plex/blob/main/CHANGELOG.md"

[project.scripts]
plex = "plex_cli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "plex_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
plex_cli = ["themes/*.toml", "tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_default_fixture_loop_scope = "function"
